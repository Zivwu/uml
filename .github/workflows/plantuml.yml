name: generate plantuml
on:
  push:
    branches:
      - main
      - test
jobs:
  generate_plantuml:
    runs-on: ubuntu-latest
    permissions: # 新增权限配置
      contents: write  # 允许读写仓库内容
    name: plantuml
    steps:
      - name: checkout
        uses: actions/checkout@v2
      - name: plantuml
        id: plantuml
        uses: grassedge/generate-plantuml-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}